<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EADB">
<title>Find Your Seat — Htoo &amp; May</title>
<meta property="og:title" content="Find Your Seat — Htoo &amp; May">
<meta property="og:description" content="Enter your name to see your table and seat — 16 October 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Noto+Serif+Myanmar:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f4ead8;--ivory2:#fbf5e9;--paper:#F4EADB;--sage:#727b57;--burg:#7c3241;--burg-d:#5f202d;--rasp:#985463;
  --gold:#b4935d;--ink:#3f362e;--muted:#7a6c5f;--line:rgba(124,50,65,.16);
  --serif:"Newsreader",Georgia,serif;--sans:"Zen Kaku Gothic New",system-ui,sans-serif;--script:"Alex Brush",cursive;
  --pad:clamp(1.25rem,6vw,3rem);--ease:cubic-bezier(.16,.84,.34,1)}
html[lang="my"]{--sans:"Noto Serif Myanmar",serif;--serif:"Noto Serif Myanmar",serif}
html[lang="my"] .t{letter-spacing:normal!important;text-transform:none!important}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;
  line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
/* soft watercolour washes, like the painted invitation */
#wash{position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 55% 38% at 8% 6%,rgba(152,84,99,.20),transparent 65%),
    radial-gradient(ellipse 50% 40% at 96% 12%,rgba(114,123,87,.20),transparent 66%),
    radial-gradient(ellipse 60% 45% at 4% 96%,rgba(114,123,87,.16),transparent 64%),
    radial-gradient(ellipse 55% 42% at 98% 92%,rgba(180,147,93,.22),transparent 64%),
    radial-gradient(ellipse 80% 60% at 50% 45%,rgba(251,245,233,.9),transparent 75%),
    var(--paper)}

#lang{position:fixed;z-index:20;right:max(1rem,env(safe-area-inset-right));top:max(1rem,env(safe-area-inset-top));
  display:flex;align-items:center;padding:.3rem;border-radius:999px;background:rgba(255,252,247,.86);
  box-shadow:0 5px 20px rgba(92,62,46,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang-b{border:0;background:none;color:var(--burg);padding:.5rem .68rem;cursor:pointer;font-size:.68rem;font-family:"Zen Kaku Gothic New",sans-serif;line-height:1}
.lang-b[lang="my"]{font-family:"Noto Serif Myanmar",serif}
.lang-b.on{color:#fff;background:var(--burg);border-radius:999px}
.lang-sep{width:1px;height:12px;background:rgba(124,50,65,.18)}
#back{position:fixed;z-index:20;left:max(1rem,env(safe-area-inset-left));top:max(1rem,env(safe-area-inset-top));
  color:var(--burg);text-decoration:none;font:500 .62rem/1 Georgia,serif;letter-spacing:.12em;text-transform:uppercase;
  padding:.72rem .9rem;border-radius:999px;background:rgba(255,252,247,.86);box-shadow:0 5px 20px rgba(92,62,46,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .3s,color .3s}
#back:hover{background:var(--burg);color:#fff8ed}

main{width:100%;max-width:620px;margin:0 auto;padding:5.5rem var(--pad) 3rem;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.rise{opacity:0;transform:translateY(18px);animation:rise 1.1s var(--ease) forwards}
.rise.d1{animation-delay:.12s}.rise.d2{animation-delay:.26s}.rise.d3{animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}
#mono{width:min(36vw,140px);height:auto;display:block;margin:0 auto 1rem}
.names{font-family:var(--script);font-size:clamp(2.7rem,12vw,4.3rem);line-height:1.05;color:var(--burg);margin:0;font-weight:400}
.names .amp{color:var(--gold);margin:0 .22em}
html[lang="my"] .names{font-family:"Noto Serif Myanmar",serif;font-size:clamp(1.8rem,8vw,2.5rem);font-weight:500;line-height:1.7}
.date{margin:.5rem 0 0;font-family:var(--serif);font-size:.82rem;letter-spacing:.42em;color:var(--sage)}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:1rem;margin:2.2rem 0 .3rem;
  font-size:.66rem;letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:2.4rem;background:rgba(180,147,93,.55)}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,8vw,2.7rem);line-height:1.2;margin:.2rem 0 1.8rem;color:var(--ink)}
html[lang="my"] h1{font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.7}

.search{position:relative;width:100%}
.search input{width:100%;font:inherit;font-family:var(--serif);font-size:clamp(1.15rem,5vw,1.45rem);font-weight:400;
  color:var(--ink);text-align:center;padding:1.1rem 3.2rem;border-radius:999px;-webkit-appearance:none;appearance:none;
  background:rgba(255,252,247,.92);border:1px solid var(--line);outline:none;
  box-shadow:0 8px 28px rgba(92,62,46,.08);transition:border-color .4s,box-shadow .4s}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:#a99a8b;font-weight:300}
.search input:focus{border-color:var(--burg);box-shadow:0 0 0 5px rgba(124,50,65,.08),0 8px 28px rgba(92,62,46,.1)}
.search svg{position:absolute;left:1.25rem;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);transition:stroke .3s}
.search input:focus ~ svg{stroke:var(--burg)}
#clear{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border-radius:50%;
  border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;display:none}
#clear:hover{color:var(--burg)}
.has-q #clear{display:block}

#results{width:100%;margin-top:1.4rem;min-height:220px}
.hint{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.02rem;margin:2rem 0 0}
html[lang="my"] .hint,html[lang="ja"] .hint{font-style:normal}
.card{display:flex;align-items:center;justify-content:space-between;gap:1rem;text-align:left;
  padding:1rem 1.35rem;margin-bottom:.75rem;border-radius:18px;
  background:rgba(255,252,247,.9);border:1px solid var(--line);box-shadow:0 6px 22px rgba(92,62,46,.07);
  opacity:0;transform:translateY(12px);animation:rise .7s var(--ease) forwards}
.card .who{font-family:var(--serif);font-size:clamp(1.05rem,4.6vw,1.28rem);color:var(--ink);overflow-wrap:anywhere}
.card .nums{display:flex;gap:1.2rem;flex-shrink:0}
.card .nums .tbl + .tbl{padding-left:1.2rem;border-left:1px solid var(--line)}
.card .tbl{display:flex;flex-direction:column;align-items:flex-end}
.card .lbl{font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:var(--sage);white-space:nowrap}
.card .num{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,8.5vw,2.6rem);line-height:1.05;color:var(--burg)}
.card.one{flex-direction:column;text-align:center;padding:1.9rem 1.4rem;border-color:rgba(180,147,93,.5);
  background:linear-gradient(180deg,rgba(255,252,247,.96),rgba(251,245,233,.96))}
.card.one .nums{gap:2rem}.card.one .nums .tbl + .tbl{padding-left:2rem}
.card.one .tbl{align-items:center}
.card.one .num{font-size:clamp(3.2rem,17vw,4.6rem)}
.miss{padding:1.7rem 1.4rem;border-radius:18px;border:1px dashed rgba(124,50,65,.28);background:rgba(255,252,247,.7)}
.miss p{margin:0}
.miss .h{font-family:var(--serif);font-size:1.2rem;color:var(--burg);margin-bottom:.4rem}
.miss .b{font-size:.86rem;color:var(--muted);max-width:22rem;margin:0 auto}
.more{font-size:.75rem;color:var(--muted);margin-top:.4rem}
.dym{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--burg);margin:0 0 .8rem}
html[lang="my"] .dym,html[lang="ja"] .dym{font-style:normal}
.card .aka{display:block;font-family:var(--sans);font-size:.72rem;color:var(--muted);margin-top:.1rem}
.miss .tip{margin-top:.7rem;font-size:.78rem;font-style:italic}
.card.pick{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.pick:hover{border-color:rgba(124,50,65,.35)}
.card.sel{border-color:var(--burg);box-shadow:0 0 0 2px rgba(124,50,65,.15),0 6px 22px rgba(92,62,46,.08)}
.plan-wrap{width:100%;margin:0 0 1.8rem;text-align:center}
.plan-wrap .eyebrow{margin-top:0}
.plan-dir{font-family:var(--serif);font-size:1.08rem;color:var(--ink);margin:.1rem 0 .7rem}
.plan-dir b{color:var(--burg);font-weight:500}
html[lang="my"] .plan-dir{font-size:.98rem;line-height:1.9}
.plan-hint{font-size:.82rem;color:var(--muted);margin:.1rem 0 .8rem}
.plan{position:relative;width:100%;border-radius:22px;background:radial-gradient(ellipse 80% 60% at 50% 40%,#fdf9f1,#f3ead9);border:1px solid var(--line);box-shadow:0 10px 30px rgba(92,62,46,.1);padding:.4rem .2rem .2rem}
#floor{display:block;width:100%;height:auto;-webkit-tap-highlight-color:transparent;user-select:none}
#floor .tb{cursor:pointer;transition:opacity .45s ease,filter .45s ease}
#floor .tb:focus{outline:none}
#floor .tb:focus-visible .top{stroke:var(--burg);stroke-width:4}
#floor.focus .tb{opacity:.2;filter:saturate(.3)}
#floor.focus .tb.on{opacity:1;filter:none}
#floor .top{fill:#fffaf2;stroke:#c9b48a;stroke-width:2.2;transition:stroke .3s,stroke-width .3s}
#floor .tb:hover .top{stroke:#a98b5a}
#floor .tb.on .top{stroke:var(--burg);stroke-width:3.5}
#floor .halo{fill:rgba(124,50,65,.06);stroke:var(--burg);stroke-width:2;stroke-dasharray:5 7;opacity:0;transition:opacity .4s}
#floor .tb.on .halo{opacity:1}
#floor .chair{fill:#d3d8bf;stroke:#a3ab88;stroke-width:1.5;transition:fill .3s,stroke .3s}
#floor .tb.on .chair.taken{fill:#bcc49f}
#floor .chair.me{fill:var(--burg);stroke:var(--burg-d)}
#floor .num circle{fill:#fffdf8;stroke:#c9b48a;stroke-width:1.3;transition:fill .3s,stroke .3s}
#floor .num text{font:500 15px Georgia,serif;fill:#6b5b4b;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#floor .num.me circle{fill:var(--burg);stroke:var(--burg)}
#floor .num.me text{fill:#fff}
#floor .letter{font:500 42px "Newsreader",Georgia,serif;fill:var(--burg);text-anchor:middle;dominant-baseline:central;pointer-events:none}
#floor .leaf{fill:#8f9c6d;opacity:.75}
#floor .bloom{fill:#fff;stroke:#e3cfcf;stroke-width:1}
#floor .bloom-c{fill:#d9b26a}
#floor .sweet-names{font:400 34px "Alex Brush",cursive;fill:var(--burg);text-anchor:middle;dominant-baseline:central}
#floor .crest{opacity:.09;pointer-events:none}
#floor .sweet-lbl{font:500 13px Georgia,serif;letter-spacing:4px;fill:#7a6c5f;text-anchor:middle}
#floor .ping{fill:none;stroke:var(--burg);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ping2 1.6s ease-out infinite;pointer-events:none}
@keyframes ping2{from{transform:scale(.8);opacity:1}to{transform:scale(2);opacity:0}}
.roster{margin-top:1rem;text-align:left;background:rgba(255,252,247,.94);border:1px solid var(--line);border-radius:18px;padding:1rem 1.1rem;box-shadow:0 6px 22px rgba(92,62,46,.07);animation:rise .5s var(--ease)}
.roster-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.roster-head h3{font:400 1.45rem/1.1 var(--serif);color:var(--burg);margin:0}
html[lang="my"] .roster-head h3{font-family:"Noto Serif Myanmar",serif;font-size:1.15rem;line-height:1.6}
.roster-head span{font-size:.75rem;color:var(--muted)}
.roster ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.1rem 1rem}
.roster li{display:flex;gap:.55rem;align-items:center;padding:.4rem .3rem;border-radius:8px;font-size:.92rem;line-height:1.35;cursor:pointer;transition:background .25s}
.roster li:hover{background:rgba(124,50,65,.05)}
.roster li .n{flex:0 0 1.65rem;height:1.65rem;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid #c9b48a;font:500 .72rem/1 Georgia,serif;color:#6b5b4b;background:#fffdf8}
.roster li .nm{overflow-wrap:anywhere}
.roster li.me{background:rgba(124,50,65,.09)}
.roster li.me .n{background:var(--burg);border-color:var(--burg);color:#fff}
.roster li.me .nm{color:var(--burg)}
.roster li.empty{cursor:default}
.roster li.empty .nm{color:#b3a596}
.roster .tbc{margin:.7rem 0 .2rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
html[lang="my"] .roster .tbc,html[lang="ja"] .roster .tbc{letter-spacing:.02em;text-transform:none}
@media (max-width:420px){.roster ol{grid-template-columns:1fr}}
/* Pop-up beside the table */
.plan .roster{position:absolute;z-index:6;margin:0;overflow:visible;padding:.7rem .75rem .55rem;border-radius:14px;
  background:rgba(255,252,247,.98);border:1px solid rgba(124,50,65,.28);box-shadow:0 14px 34px rgba(75,52,42,.22);animation:pop .28s var(--ease)}
.plan .roster > ol, .plan .roster > .tbc{position:relative}
.plan .roster{display:flex;flex-direction:column}
.plan .roster[hidden]{display:none}
.plan .roster .roster-scroll{overflow:auto;min-height:0;flex:1 1 auto;overscroll-behavior:contain}
.plan .roster ol{grid-template-columns:1fr;gap:0}
.plan .roster li{font-size:.8rem;padding:.26rem .2rem;gap:.45rem}
.plan .roster li .n{flex-basis:1.35rem;height:1.35rem;font-size:.62rem}
.plan .roster-head{margin-bottom:.3rem;padding:0 1.4rem .3rem 0}
.plan .roster-head h3{font-size:1.15rem}
html[lang="my"] .plan .roster-head h3{font-size:.98rem}
.plan .roster-head span{font-size:.66rem}
.plan .roster .tbc{margin:.4rem 0 .1rem;font-size:.6rem}
.roster-x{position:absolute;top:.35rem;right:.4rem;width:1.7rem;height:1.7rem;border:0;border-radius:50%;background:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer}
.roster-x:hover{background:rgba(124,50,65,.08);color:var(--burg)}
.plan .roster::before{content:"";position:absolute;top:var(--arrow,50%);width:12px;height:12px;background:inherit;transform:translateY(-50%) rotate(45deg);
  border:1px solid rgba(124,50,65,.28)}
.plan .roster.from-left::before{left:-7px;border-right:0;border-top:0}
.plan .roster:not(.from-left)::before{right:-7px;border-left:0;border-bottom:0}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.plan-reset{margin-top:.9rem;background:none;border:1px solid rgba(124,50,65,.3);color:var(--burg);border-radius:999px;padding:.6rem 1.05rem;font:500 .6rem/1 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.plan-reset:hover{background:rgba(124,50,65,.06)}
html[lang="my"] .plan-reset,html[lang="ja"] .plan-reset{letter-spacing:.02em;text-transform:none;font-family:var(--sans);font-size:.76rem}
.plan-note{font-size:.72rem;letter-spacing:.06em;color:var(--muted);margin:.8rem 0 0}
@media (prefers-reduced-motion:reduce){#floor .ping{animation:none}#floor .tb{transition:none}.roster{animation:none}}
.status{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:.9rem;min-height:1em}

@media (prefers-reduced-motion:reduce){.rise,.card{animation:none;opacity:1;transform:none}}

/* Opening film (assets/seat/intro.mp4, portrait 720×1280) */
#intro{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s}
#intro video{width:100%;height:100%;object-fit:cover;background:var(--paper)}
@media (min-aspect-ratio:3/4){#intro video{object-fit:contain}}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.intro-btn{position:absolute;bottom:max(1.2rem,env(safe-area-inset-bottom));border:1px solid rgba(124,50,65,.25);background:rgba(255,252,247,.88);color:var(--burg);
  border-radius:999px;padding:.65rem 1.05rem;font:500 .62rem/1 Georgia,serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 5px 18px rgba(92,62,46,.14)}
#introSkip{right:max(1rem,env(safe-area-inset-right))}
#introSound{left:max(1rem,env(safe-area-inset-left))}
html[lang="ja"] .intro-btn,html[lang="my"] .intro-btn{letter-spacing:.04em;text-transform:none;font-family:var(--sans);font-size:.74rem}
body.intro-on{overflow:hidden}
body.intro-on .rise{animation-play-state:paused}
</style>
</head>
<body>
<div id="intro" role="dialog" aria-label="Opening film">
  <video id="introVideo" muted playsinline autoplay preload="auto"
    poster="https://res.cloudinary.com/j3lgvkwu/video/upload/so_0,f_jpg,q_auto,w_720/Leaves_parting_revealing_venue_202607161340_axshqw.jpg">
    <source src="https://res.cloudinary.com/j3lgvkwu/video/upload/f_auto,q_auto/Leaves_parting_revealing_venue_202607161340_axshqw.mp4" type="video/mp4">
  </video>
  <button class="intro-btn" id="introSound" type="button">♪ Sound</button>
  <button class="intro-btn" id="introSkip" type="button">Skip ›</button>
</div>
<script>
// Play the opening film first, then reveal the seat page.
(function(){
  var box = document.getElementById("intro"), v = document.getElementById("introVideo"),
      skip = document.getElementById("introSkip"), snd = document.getElementById("introSound"), done = false;
  var lang = "en"; try{ lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("hm-lang") || "en"; }catch(e){}
  var L = {en:["Skip ›","♪ Sound","♪ Sound on"], ja:["スキップ ›","♪ 音を出す","♪ 音あり"], my:["ကျော်ရန် ›","♪ အသံဖွင့်ရန်","♪ အသံဖွင့်ထားသည်"]}[lang] || ["Skip ›","♪ Sound","♪ Sound on"];
  skip.textContent = L[0]; snd.textContent = L[1];
  function end(){
    if(done) return; done = true;
    box.classList.add("gone");
    document.body.classList.remove("intro-on");
    setTimeout(function(){ try{ v.pause(); }catch(e){} box.remove(); }, 1000);
  }
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ end(); return; }
  document.body.classList.add("intro-on");
  v.addEventListener("ended", end);
  v.addEventListener("error", end);
  var srcEl = v.querySelector("source"); if(srcEl) srcEl.addEventListener("error", end);
  skip.addEventListener("click", end);
  snd.addEventListener("click", function(){ v.muted = !v.muted; snd.textContent = v.muted ? L[1] : L[2]; if(v.paused) v.play().catch(function(){}); });
  var p = v.play();
  if(p && p.catch) p.catch(function(){
    // Autoplay blocked: start on the first tap, otherwise guests can still Skip
    box.addEventListener("click", function(e){ if(e.target === skip) return; v.play().catch(end); }, {once:true});
  });
  setTimeout(end, 15000); // safety net if the video stalls
})();
</script>
<div id="wash"></div>

<a id="back" href="../" class="t" data-t="back">← Invitation</a>
<div id="lang" role="group" aria-label="Language">
  <button class="lang-b on" data-lang="en" lang="en">EN</button><span class="lang-sep"></span>
  <button class="lang-b" data-lang="ja" lang="ja">日本語</button><span class="lang-sep"></span>
  <button class="lang-b" data-lang="my" lang="my">မြန်မာ</button>
</div>

<main>
  <img id="mono" class="rise" src="../assets/photos/monogram-burgundy-hd.png" alt="Htoo &amp; May monogram">
  <p class="names rise d1"><span data-t="nameHtoo">Htoo</span><span class="amp">&amp;</span><span data-t="nameMay">May</span></p>
  <p class="date rise d1">16 · 10 · 2026</p>
  <p class="eyebrow t rise d2" data-t="eyebrow">Welcome</p>
  <h1 class="rise d2" data-t="title">Please find your seat</h1>

  <section id="plan" class="plan-wrap rise d3" aria-labelledby="planTitle">
    <p class="eyebrow t" id="planTitle" data-t="planTitle">Seating plan</p>
    <p class="plan-dir" id="planDir" hidden></p>
    <p class="plan-hint t" id="planHint" data-t="planHint">Tap a table to see who's sitting there.</p>
    <div class="plan"><svg id="floor" viewBox="95 150 870 1065" role="group" aria-label="Seating plan: sweetheart table at the top, tables A to H below"></svg>
      <div class="roster" id="roster" hidden aria-live="polite"></div></div>
    <button class="plan-reset t" id="planReset" type="button" data-t="showAll" hidden>Show all tables</button>
    <p class="plan-note t" data-t="planNote">The plan is drawn as you face the sweetheart table.</p>
  </section>

  <div class="search rise d3" id="searchBox">
    <input id="q" type="search" lang="en" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search" aria-label="Search your name">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>

  </div>
  <p class="status t" id="status" aria-live="polite"></p>
  <div id="results" aria-live="polite"></div>

</main>


<script>
(function(){
  // Guest data lives in guests.json next to this file. See README.md.
  var CONFIG_URL = "guests.json";
  var MAX_RESULTS = 12;

  var T = {
    en:{nameMay:"May",nameHtoo:"Htoo",back:"← Invitation",eyebrow:"Welcome",title:"Please find your seat",
      placeholder:"Type your name in English…",hint:"Enter your name to see your table",table:"Table",seat:"Seat",
      notFoundH:"We couldn't find you",notFoundB:"No match for “{q}”. Please check the spelling, or ask our welcome staff — we'll gladly help.",

      showAll:"Show all tables",guestsN:"{n} guests",seatTbc:"Seat to be confirmed",

      left:"on the left",right:"on the right",rows:["front row","2nd row","3rd row","back row"],

    ja:{nameMay:"May",nameHtoo:"Htoo",back:"← 招待状へ",eyebrow:"ようこそ",title:"お席をご確認ください",
      placeholder:"お名前を英語（ローマ字）で入力…",hint:"お名前を入力すると、お席が表示されます",table:"テーブル",seat:"席番号",
      notFoundH:"お名前が見つかりません",notFoundB:"「{q}」に一致するお名前がありません。綴りをご確認いただくか、受付スタッフにお声がけください。",
      more:"さらに入力して絞り込んでください（他 {n} 件）",loading:"ゲストリストを読み込み中…",
      didYouMean:"もしかして…？",tryHint:"ヒント：お名前の一部（ローマ字）だけでも検索できます。",
      planTitle:"座席表",planHint:"テーブルをタップすると、そのテーブルのゲストが表示されます。",planNote:"高砂（メインテーブル）を正面に見た配置図です。",
      showAll:"すべてのテーブルを表示",guestsN:"{n}名",seatTbc:"お席は当日ご案内します",

      dir:"高砂を正面に見て、<b>{t}テーブル</b>は{side}の{row}です。",dirSeat:"お席は<b>{s}番</b>です。"},
    my:{nameMay:"မေ",nameHtoo:"ထူး",back:"← ဖိတ်စာသို့",eyebrow:"ကြိုဆိုပါသည်",title:"သင်၏ထိုင်ခုံကို ရှာဖွေပါ",
      placeholder:"အမည်ကို အင်္ဂလိပ်လို ရိုက်ထည့်ပါ…",hint:"စားပွဲနှင့် ထိုင်ခုံအမှတ်ကို သိရှိရန် အမည်ရိုက်ထည့်ပါ",table:"စားပွဲ",seat:"ထိုင်ခုံ",
      notFoundH:"အမည် မတွေ့ရှိပါ",notFoundB:"“{q}” နှင့် ကိုက်ညီသော အမည်မတွေ့ပါ။ စာလုံးပေါင်း ပြန်စစ်ပါ သို့မဟုတ် ကြိုဆိုရေးဝန်ထမ်းများကို မေးမြန်းပါ။",
      more:"ဆက်လက်ရိုက်ထည့်ပါ (နောက်ထပ် {n} ဦး)",loading:"ဧည့်စာရင်း ရယူနေသည်…",
      didYouMean:"ဤအမည်လား…?",tryHint:"အကြံပြုချက် - အမည်၏ တစ်စိတ်တစ်ပိုင်းကိုသာ (အင်္ဂလိပ်စာဖြင့်) ရိုက်ကြည့်ပါ။",
      planTitle:"ထိုင်ခုံနေရာပြ မြေပုံ",planHint:"စားပွဲကို နှိပ်ပြီး ထိုစားပွဲတွင် ထိုင်မည့်သူများကို ကြည့်နိုင်ပါသည်။",planNote:"သတို့သား၊ သတို့သမီး ထိုင်မည့် Sweetheart Table ကို မျက်နှာမူထားသည့်အတိုင်း ပြထားသော မြေပုံဖြစ်ပါသည်။",
      showAll:"စားပွဲအားလုံး ပြန်ကြည့်ရန်",guestsN:"ဧည့်သည် {n} ဦး",seatTbc:"ထိုင်ခုံနံပါတ်ကို ပွဲနေ့တွင် လမ်းညွှန်ပေးပါမည်",
      tapHint:"အမည်ကို နှိပ်ပြီး မြေပုံပေါ်တွင် ကြည့်နိုင်ပါသည်",
      left:"ဘယ်ဘက်ခြမ်း",right:"ညာဘက်ခြမ်း",rows:["ရှေ့ဆုံးတန်း","ရှေ့မှ ဒုတိယတန်း","ရှေ့မှ တတိယတန်း","နောက်ဆုံးတန်း"],
      dir:"Sweetheart Table ကို မျက်နှာမူပြီး ကြည့်လျှင် <b>စားပွဲ {t}</b> သည် {side} {row}တွင် ရှိပါသည်။",dirSeat:" သင့်ထိုင်ခုံနံပါတ်မှာ <b>{s}</b> ဖြစ်ပါသည်။"}
  };

  var lang = "en", guests = [], loading = true;
  var $q = document.getElementById("q"), $res = document.getElementById("results"),
      $status = document.getElementById("status"), $box = document.getElementById("searchBox");

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function norm(s){return String(s).toLowerCase().normalize("NFKC").replace(/\s+/g," ").trim();}

  function setLang(l){
    if(!T[l]) l = "en";
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll(".lang-b").forEach(function(b){b.classList.toggle("on",b.dataset.lang===l);});
    document.querySelectorAll("[data-t]").forEach(function(el){var v=T[l][el.dataset.t]; if(v!=null) el.textContent=v;});
    $q.placeholder = T[l].placeholder;
    try{ localStorage.setItem("hm-lang", l); }catch(e){}
    render();
    if(activeTable) selectTable(activeTable, selected, planSource);
  }

  function render(){
    var t = T[lang], raw = $q.value, q = norm(raw);
    $box.classList.toggle("has-q", raw.length>0);
    $status.textContent = loading ? t.loading : "";
    shownList = [];
    if(!q){ $res.innerHTML = '<p class="hint">'+esc(t.hint)+'</p>'; showPlan(null); return; }
    if(loading){ $res.innerHTML = ""; showPlan(null); return; }
    var r = search(raw), hits = r.hits;
    if(!hits.length){
      $res.innerHTML = '<div class="miss"><p class="h">'+esc(t.notFoundH)+'</p><p class="b">'+esc(t.notFoundB.replace("{q}",raw.trim()))+'</p>'+
        '<p class="b tip">'+esc(t.tryHint)+'</p></div>';
      showPlan(null);
      return;
    }
    var shown = shownList = hits.slice(0,MAX_RESULTS), one = hits.length===1 && !r.fuzzy;
    // keep the guest's previous pick if it is still in the list; otherwise auto-pick a single exact match
    var keep = selected && shown.indexOf(selected)>-1 ? selected : (one ? shown[0] : null);
    $res.innerHTML = (r.fuzzy ? '<p class="dym t">'+esc(t.didYouMean)+'</p>' : '') +
      (!one && TABLES ? '<p class="more t" style="margin:0 0 .7rem">'+esc(t.tapHint)+'</p>' : '') + shown.map(function(g,i){
      return '<div class="card pick'+(one?' one':'')+(g===keep?' sel':'')+'" data-i="'+i+'" role="button" tabindex="0" style="animation-delay:'+(i*0.05)+'s">'+
        '<span class="who">'+esc(g.name)+(g.aka.length ? '<small class="aka">'+esc(g.aka.join(" · "))+'</small>' : '')+'</span>'+
        '<span class="nums">'+
          '<span class="tbl"><span class="lbl t">'+esc(t.table)+'</span><span class="num">'+esc(g.table)+'</span></span>'+
          (g.seat ? '<span class="tbl"><span class="lbl t">'+esc(t.seat)+'</span><span class="num">'+esc(g.seat)+'</span></span>' : '')+
        '</span></div>';
    }).join("") + (hits.length>MAX_RESULTS ? '<p class="more">'+esc(t.more.replace("{n}",hits.length-MAX_RESULTS))+'</p>' : "");
    showPlan(keep);
  }

  // ---- Seating plan (drawn in SVG, laid out like the printed Table Guide) ----
  // Coordinates follow the guide artwork (1055 wide), drawn facing the sweetheart table at the top.
  // Round tables seat 1–6 clockwise from the top (1 top, 6 upper-right … 2 upper-left).
  // Long tables: odd seats down the left side, even seats down the right, 1 & 2 at the top.
  var TABLES = {
    A:{c:[716,410],side:"right",row:0}, B:{c:[337,410],side:"left",row:0},
    C:{c:[272,612],side:"left",row:1,rot:18,long:true}, D:{c:[783,612],side:"right",row:1,rot:-18,long:true},
    E:{c:[820,850],side:"right",row:2}, F:{c:[233,850],side:"left",row:2},
    G:{c:[322,1066],side:"left",row:3,rot:-18,long:true}, H:{c:[732,1066],side:"right",row:3,rot:18,long:true}
  };
  var ROUND_ANGLE = {1:0,6:60,5:120,4:180,3:240,2:300};
  var SVGNS = "http://www.w3.org/2000/svg";
  var $floor = document.getElementById("floor"), $roster = document.getElementById("roster"),
      $dir = document.getElementById("planDir"), $hint = document.getElementById("planHint"),
      $reset = document.getElementById("planReset"), $plan = document.getElementById("plan");
  var shownList = [], selected = null, activeTable = null, planSource = null;

  function el(name, attrs, parent){
    var n = document.createElementNS(SVGNS, name);
    for(var k in attrs) n.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(n);
    return n;
  }
  function rotPt(x, y, deg){ var r = deg*Math.PI/180; return [x*Math.cos(r) - y*Math.sin(r), x*Math.sin(r) + y*Math.cos(r)]; }
  function flora(parent, x, y, s){
    var g = el("g", {transform:"translate("+x+" "+y+") scale("+(s||1)+")"}, parent);
    [[-14,-4,-30],[14,-4,30],[-10,9,20],[10,9,-20],[0,-13,0]].forEach(function(l){
      el("ellipse", {"class":"leaf", cx:l[0], cy:l[1], rx:9, ry:4, transform:"rotate("+l[2]+" "+l[0]+" "+l[1]+")"}, g);
    });
    [[-6,0],[6,2],[0,-5]].forEach(function(b){
      el("circle", {"class":"bloom", cx:b[0], cy:b[1], r:5}, g); el("circle", {"class":"bloom-c", cx:b[0], cy:b[1], r:1.6}, g);
    });
  }
  function seatLabel(parent, n, x, y){
    var g = el("g", {"class":"num", "data-s":n}, parent);
    el("circle", {cx:x, cy:y, r:13}, g);
    var tx = el("text", {x:x, y:y}, g); tx.textContent = n;
  }

  function drawFloor(){
    // Faded monogram in the middle of the banquet floor (behind everything)
    el("image", {"class":"crest", href:"../assets/photos/monogram-burgundy-hd.png", x:387, y:600, width:280, height:280, preserveAspectRatio:"xMidYMid meet"}, $floor);

    // Sweetheart table — Htoo & May
    var sw = el("g", {"class":"sweet"}, $floor);
    var lbl = el("text", {"class":"sweet-lbl", x:527, y:176}, sw); lbl.textContent = "SWEETHEART TABLE";
    el("rect", {x:497, y:192, width:26, height:22, rx:6, "class":"chair"}, sw);
    el("rect", {x:531, y:192, width:26, height:22, rx:6, "class":"chair"}, sw);
    el("rect", {x:427, y:212, width:200, height:58, rx:8, "class":"top"}, sw);
    flora(sw, 446, 241, .6); flora(sw, 608, 241, .6);
    var names = el("text", {"class":"sweet-names", x:527, y:243}, sw); names.textContent = "Htoo & May";

    Object.keys(TABLES).forEach(function(key){
      var tb = TABLES[key], cx = tb.c[0], cy = tb.c[1];
      var g = el("g", {"class":"tb", "data-t":key, tabindex:"0", role:"button", "aria-label":"Table "+key}, $floor);
      if(!tb.long){
        el("circle", {"class":"halo", cx:cx, cy:cy, r:112}, g);
        [1,2,3,4,5,6].forEach(function(n){
          var a = ROUND_ANGLE[n], r = a*Math.PI/180;
          var x = cx + 80*Math.sin(r), y = cy - 80*Math.cos(r);
          el("rect", {"class":"chair", "data-s":n, x:x-17, y:y-12, width:34, height:24, rx:7, transform:"rotate("+a+" "+x+" "+y+")"}, g);
        });
        el("circle", {"class":"top", cx:cx, cy:cy, r:58}, g);
        flora(g, cx, cy+28, .85);
        [1,2,3,4,5,6].forEach(function(n){
          var r = ROUND_ANGLE[n]*Math.PI/180;
          seatLabel(g, n, cx + 120*Math.sin(r), cy - 120*Math.cos(r));
        });
        tb.seatXY = function(n){ var r = ROUND_ANGLE[n]*Math.PI/180; return [cx + 120*Math.sin(r), cy - 120*Math.cos(r)]; };
      } else {
        var body = el("g", {transform:"translate("+cx+" "+cy+") rotate("+tb.rot+")"}, g);
        el("rect", {"class":"halo", x:-92, y:-160, width:184, height:320, rx:40}, body);
        for(var k=0;k<5;k++){
          var yy = -100 + k*50;
          el("rect", {"class":"chair", "data-s":2*k+1, x:-73, y:yy-17, width:24, height:34, rx:7}, body);
          el("rect", {"class":"chair", "data-s":2*k+2, x:49, y:yy-17, width:24, height:34, rx:7}, body);
        }
        el("rect", {"class":"top", x:-46, y:-128, width:92, height:256, rx:6}, body);
        flora(body, 0, -70, .9); flora(body, 0, 70, .9);
        var pts = {};
        for(var j=0;j<5;j++){
          var y2 = -100 + j*50, L = rotPt(-100, y2, tb.rot), R = rotPt(100, y2, tb.rot);
          pts[2*j+1] = [cx+L[0], cy+L[1]]; pts[2*j+2] = [cx+R[0], cy+R[1]];
        }
        Object.keys(pts).forEach(function(n){ seatLabel(g, n, pts[n][0], pts[n][1]); });
        tb.seatXY = function(n){ return pts[n]; };
      }
      var L2 = el("text", {"class":"letter", x:cx, y:tb.long ? cy : cy-8}, g); L2.textContent = key;
    });
  }

  function tableKey(g){ return g ? String(g.table).trim().toUpperCase().replace(/^TABLE\s*/,"") : ""; }
  function seatNo(g){ return String((g && g.seat) || "").replace(/[^\d]/g,""); }

  function selectTable(key, guest, source){
    var tb = TABLES[key];
    if(!tb){ clearPlan(); return; }
    activeTable = key; selected = guest || null; planSource = source || planSource;
    var t = T[lang], mySeat = seatNo(selected);
    var people = guests.filter(function(g){ return tableKey(g)===key; });
    var taken = {}; people.forEach(function(g){ var s = seatNo(g); if(s){ (taken[s] = taken[s] || []).push(g); } });

    $floor.classList.add("focus");
    $floor.querySelectorAll(".ping").forEach(function(p){ p.remove(); });
    $floor.querySelectorAll(".tb").forEach(function(g){
      var on = g.getAttribute("data-t")===key;
      g.classList.toggle("on", on);
      g.querySelectorAll(".chair").forEach(function(c){
        var s = c.getAttribute("data-s");
        c.classList.toggle("taken", on && !!taken[s]);
        c.classList.toggle("me", on && !!mySeat && s===mySeat);
      });
      g.querySelectorAll(".num").forEach(function(n){ n.classList.toggle("me", on && !!mySeat && n.getAttribute("data-s")===mySeat); });
      if(on && mySeat && tb.seatXY(mySeat)){
        var p = tb.seatXY(mySeat); el("circle", {"class":"ping", cx:p[0], cy:p[1], r:14}, g);
      }
    });

    // Directions
    $dir.innerHTML = t.dir.replace("{t}",esc(key)).replace("{side}",t[tb.side]).replace("{row}",t.rows[tb.row]) +
      (selected && mySeat ? t.dirSeat.replace("{s}",esc(mySeat)) : "");
    $dir.hidden = false; $hint.hidden = true; $reset.hidden = false;

    // Who is at this table
    var max = tb.long ? 10 : 6, rows = "";
    for(var n=1;n<=max;n++){
      var at = taken[n] || [];
      if(!at.length) rows += '<li class="empty"><span class="n">'+n+'</span><span class="nm">—</span></li>';
      at.forEach(function(g){
        rows += '<li class="'+(g===selected?'me':'')+'" data-g="'+guests.indexOf(g)+'"><span class="n">'+n+'</span><span class="nm">'+esc(g.name)+'</span></li>';
      });
    }
    var tbc = people.filter(function(g){ return !seatNo(g); }), tbcRows = tbc.map(function(g){
      return '<li class="'+(g===selected?'me':'')+'" data-g="'+guests.indexOf(g)+'"><span class="n">·</span><span class="nm">'+esc(g.name)+'</span></li>';
    }).join("");
    $roster.innerHTML = '<button class="roster-x" type="button" aria-label="Close">×</button>'+
      '<div class="roster-head"><h3>'+esc(t.table)+' '+esc(key)+'</h3><span>'+esc(t.guestsN.replace("{n}",people.length))+'</span></div>'+
      '<div class="roster-scroll"><ol>'+rows+'</ol>' + (tbc.length ? '<p class="tbc">'+esc(t.seatTbc)+'</p><ol>'+tbcRows+'</ol>' : '')+'</div>';
    $roster.hidden = false;
    placeRoster();
    // keep the highlighted guest in view inside the card (without scrolling the page)
    var me = $roster.querySelector("li.me"), sc = $roster.querySelector(".roster-scroll");
    if(me && sc) sc.scrollTop = Math.max(0, me.offsetTop - sc.offsetTop - sc.clientHeight/2);
  }

  // Float the guest list beside its table, on the side facing the open middle of the room
  var VB = [95,150,870,1065];
  function placeRoster(){
    var tb = TABLES[activeTable]; if(!tb || $roster.hidden) return;
    var box = $roster.parentElement, br = box.getBoundingClientRect(), sr = $floor.getBoundingClientRect();
    var k = sr.width / VB[2];
    var cx = sr.left - br.left + (tb.c[0]-VB[0])*k, cy = sr.top - br.top + (tb.c[1]-VB[1])*k;
    var reach = (tb.long ? 112 : 132) * k, gap = 8;
    var avail = tb.side==="left" ? br.width - (cx + reach + gap) - 6 : (cx - reach - gap) - 6;
    var w = Math.max(168, Math.min(270, avail));
    $roster.style.width = w + "px";
    $roster.style.maxHeight = Math.min(br.height - 12, 380) + "px";
    var h = $roster.offsetHeight;
    var left = tb.side==="left" ? cx + reach + gap : cx - reach - gap - w;
    left = Math.max(6, Math.min(br.width - w - 6, left));
    var top = Math.max(6, Math.min(br.height - h - 6, cy - h/2));
    $roster.style.left = left + "px"; $roster.style.top = top + "px";
    $roster.classList.toggle("from-left", tb.side==="left");
    $roster.style.setProperty("--arrow", Math.max(16, Math.min(h - 16, cy - top)) + "px");
  }
  window.addEventListener("resize", placeRoster);

  function clearPlan(){
    activeTable = null; selected = null; planSource = null;
    $floor.classList.remove("focus");
    $floor.querySelectorAll(".tb").forEach(function(g){ g.classList.remove("on"); });
    $floor.querySelectorAll(".chair.me,.chair.taken,.num.me").forEach(function(c){ c.classList.remove("me","taken"); });
    $floor.querySelectorAll(".ping").forEach(function(p){ p.remove(); });
    $dir.hidden = true; $roster.hidden = true; $reset.hidden = true; $hint.hidden = false;
    $res.querySelectorAll(".card.sel").forEach(function(c){ c.classList.remove("sel"); });
  }

  // Search → plan
  function showPlan(g){
    if(g){ selectTable(tableKey(g), g, "search"); return; }
    if(planSource==="search") clearPlan();
  }

  function pick(el2){
    var g = shownList[+el2.dataset.i]; if(!g) return;
    $res.querySelectorAll(".card.sel").forEach(function(c){ c.classList.remove("sel"); });
    el2.classList.add("sel");
    selectTable(tableKey(g), g, "search");
    $plan.scrollIntoView({behavior:"smooth", block:"start"});
  }
  $res.addEventListener("click", function(e){ var c = e.target.closest(".card.pick"); if(c) pick(c); });
  $res.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ var c = e.target.closest(".card.pick"); if(c){ e.preventDefault(); pick(c); } } });

  // Plan → people
  function tapTable(gEl, target){
    var key = gEl.getAttribute("data-t");
    var s = target && target.closest ? (target.closest(".chair,.num") || null) : null;
    var seat = s ? s.getAttribute("data-s") : "";
    var who = seat ? guests.filter(function(g){ return tableKey(g)===key && seatNo(g)===seat; })[0] : null;
    $res.querySelectorAll(".card.sel").forEach(function(c){ c.classList.remove("sel"); });
    selectTable(key, who || null, "table");
  }
  $floor.addEventListener("click", function(e){
    var gEl = e.target.closest(".tb");
    if(gEl) tapTable(gEl, e.target);
    else if(activeTable) clearPlan();
  });
  $floor.addEventListener("keydown", function(e){
    if(e.key!=="Enter" && e.key!==" ") return;
    var gEl = e.target.closest(".tb"); if(!gEl) return;
    e.preventDefault(); tapTable(gEl, null);
  });
  $roster.addEventListener("click", function(e){
    if(e.target.closest(".roster-x")){ clearPlan(); return; }
    var li = e.target.closest("li[data-g]"); if(!li) return;
    selectTable(activeTable, guests[+li.getAttribute("data-g")], planSource);
  });
  $reset.addEventListener("click", function(){ clearPlan(); });

  drawFloor();

  // ---- Name matching ----
  // Guests may type names differently from the sheet: other word order, with or
  // without honorifics (U, Daw, Ko, Ma…), joined words, or small spelling slips
  // (Htet/Het, Myat/Mya, Thandar/Thanda). Pass 1 = forgiving exact match,
  // pass 2 (only if pass 1 finds nothing) = "Did you mean…?" fuzzy suggestions.
  var HONORIFICS = ["u","daw","ko","ma","mg","dr","mr","mrs","ms","miss","saya","sayar","sayama","san","sama","chan","kun"];
  var FUZZY_MAX = 6;

  function words(s){
    return String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase()
      .replace(/[^\p{L}\p{M}\p{N}]+/gu," ").trim().split(" ").filter(Boolean);
  }
  function core(ws){ var c = ws.filter(function(w){ return HONORIFICS.indexOf(w)<0; }); return c.length ? c : ws; }
  // Sound-alike key for romanised names: drop "h" after a consonant (Htoo→Too, Thet→Tet), squeeze doubled letters (Aung→Aung, Moee→Moe)
  function key(w){ return w.replace(/([b-df-gj-np-tv-z])h/g,"$1").replace(/(.)\1+/g,"$1"); }
  function lev(a,b){
    if(a===b) return 0; if(!a.length) return b.length; if(!b.length) return a.length;
    var prev=[], cur, i, j;
    for(j=0;j<=b.length;j++) prev[j]=j;
    for(i=1;i<=a.length;i++){ cur=[i];
      for(j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      prev=cur; }
    return prev[b.length];
  }
  function allowed(len){ return len<=2 ? 0 : len<=4 ? 1 : 2; }

  function prep(g){
    if(g._p) return g._p;
    var names = [g.name].concat(g.aka);
    return g._p = names.map(function(n){
      var ws = core(words(n));
      return {ws:ws, keys:ws.map(key), joined:ws.join(""), flat:words(n).join(" ")};
    });
  }

  function search(raw){
    var qAll = words(raw);
    if(!qAll.length) return {hits:[], fuzzy:false};
    var qw = core(qAll), qFlat = qAll.join(" "), qJoined = qw.join("");

    // Pass 1: substring of the full name, joined-words match, or every typed word starts a name word (any order)
    var exact = [];
    guests.forEach(function(g){
      var best = 99;
      prep(g).forEach(function(v){
        var s = 99;
        if(v.flat===qFlat || v.joined===qJoined) s = 0;
        else if(v.flat.indexOf(qFlat)===0) s = 1;
        else if(v.flat.indexOf(qFlat)>-1 || v.joined.indexOf(qJoined)>-1) s = 2;
        else if(qw.every(function(q){ return v.ws.some(function(w){ return w.indexOf(q)===0; }); })) s = 3;
        if(s<best) best = s;
      });
      if(best<99) exact.push({g:g, s:best});
    });
    if(exact.length){
      exact.sort(function(a,b){ return a.s-b.s || a.g.name.localeCompare(b.g.name); });
      return {hits:exact.map(function(x){return x.g;}), fuzzy:false};
    }

    // Pass 2: sound-alike + small typos, per word and on the whole name
    var qk = qw.map(key), qJk = key(qJoined), fuzzy = [];
    guests.forEach(function(g){
      var best = 99;
      prep(g).forEach(function(v){
        var total = 0, ok = qk.every(function(q){
          if(q.length<2) return true;
          var d = Math.min.apply(null, v.keys.map(function(k){
            return k.indexOf(q)===0 ? 0 : lev(q, k.length>q.length+2 ? k.slice(0,q.length+1) : k);
          }));
          total += d; return d <= allowed(q.length);
        });
        if(ok && total<best) best = total;
        var dj = lev(qJk, key(v.joined));
        if(dj <= allowed(qJk.length) && dj<best) best = dj;
      });
      if(best<99) fuzzy.push({g:g, s:best});
    });
    fuzzy.sort(function(a,b){ return a.s-b.s || a.g.name.localeCompare(b.g.name); });
    return {hits:fuzzy.slice(0,FUZZY_MAX).map(function(x){return x.g;}), fuzzy:true};
  }

  // ---- Data loading ----
  function sheetIdFrom(s){ s=String(s||"").trim(); var m=s.match(/\/d\/([a-zA-Z0-9_-]+)/); return m?m[1]:s; }

  function parseCSV(text){
    var rows=[], row=[], f="", i=0, q=false, c;
    for(;i<text.length;i++){
      c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(f); f=""; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
      else f+=c;
    }
    if(f!==""||row.length){ row.push(f); rows.push(row); }
    return rows;
  }

  // Same column rules as the Amoré Findyourseat app:
  // Name / Full Name, Table / Table Number / Seat, optional Attendance, optional Guest Info (extra names).
  function guestsFromRows(rows){
    if(!rows.length) return [];
    var head = rows[0].map(function(h){return norm(h);});
    function col(names){ for(var i=0;i<names.length;i++){ var k=head.indexOf(names[i]); if(k>-1) return k; } return -1; }
    var cName = col(["full name","name"]); if(cName<0) cName = head.findIndex(function(h){return h.indexOf("name")>-1 && h!=="guest info";});
    var cTable = col(["table no","table no.","table","table number"]);
    var cSeat = col(["seat no","seat no.","seat","seat number"]);
    var cAtt = col(["attendance"]), cInfo = col(["guest info"]);
    if(cName<0) return [];
    var out=[];
    rows.slice(1).forEach(function(r){
      if(cAtt>-1 && norm(r[cAtt]||"") && norm(r[cAtt])!=="attend") return;
      var table = cTable>-1 ? String(r[cTable]||"").trim() : "";
      if(!table) table = "?";
      var seat = cSeat>-1 ? String(r[cSeat]||"").trim() : "";
      var name = String(r[cName]||"").trim();
      if(name) out.push({name:name, table:table, seat:seat});
      if(cInfo>-1 && r[cInfo]){
        String(r[cInfo]).split(/[,、&]|\band\b/i).map(function(n){return n.trim();})
          .filter(function(n){return n.length>1;}).forEach(function(n){ out.push({name:n, table:table, seat:seat}); });
      }
    });
    return out;
  }

  function fromJson(list){
    return (list||[]).map(function(g){ return {name:String(g.name||"").trim(),
        table:String(g.table!=null&&g.table!==""?g.table:(g.tableNumber!=null?g.tableNumber:"?")),
        seat:String(g.seat!=null?g.seat:"").trim(),
        aka:(Array.isArray(g.aka) ? g.aka : String(g.aka||"").split(/[,、;\/]/)).map(function(s){return String(s).trim();}).filter(Boolean)}; })
      // drop empty names and header rows repeated inside the sheet ("Guest Names | Table No | Seat No")
      .filter(function(g){return g.name && !/^table( no\.?| number)?$/i.test(g.table);});
  }

  function load(){
    loading = true; render();
    fetch(CONFIG_URL, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("guests.json "+r.status); return r.json(); })
      .then(function(cfg){
        var local = fromJson(cfg.guests);
        // 1) Private sheet via Apps Script feed (apps-script/seating) — preferred
        if(cfg.seatingEndpoint){
          return fetch(cfg.seatingEndpoint+(cfg.seatingEndpoint.indexOf("?")>-1?"&":"?")+"_="+Date.now())
            .then(function(r){ if(!r.ok) throw new Error("feed "+r.status); return r.json(); })
            .then(function(d){ if(!d.ok) throw new Error(d.error||"feed error"); var g = fromJson(d.guests); return g.length ? g : local; })
            .catch(function(err){ console.warn("Seating feed failed, using guests.json list:", err); return local; });
        }
        // 2) Public ("anyone with link") Google Sheet
        var id = sheetIdFrom(cfg.googleSheet);
        if(!id) return local;
        var url = "https://docs.google.com/spreadsheets/d/"+encodeURIComponent(id)+"/gviz/tq?tqx=out:csv"+
          (cfg.sheetTab ? "&sheet="+encodeURIComponent(cfg.sheetTab) : "")+"&_="+Date.now();
        return fetch(url).then(function(r){ if(!r.ok) throw new Error("sheet "+r.status); return r.text(); })
          .then(function(csv){ var g = guestsFromRows(parseCSV(csv)); return g.length ? g : local; })
          .catch(function(err){ console.warn("Google Sheet failed, using guests.json list:", err); return local; });
      })
      .then(function(list){ guests = list || []; })
      .catch(function(err){ console.error(err); guests = []; })
      .then(function(){ loading = false; render(); if(activeTable) selectTable(activeTable, selected, planSource); });
  }

  document.querySelectorAll(".lang-b").forEach(function(b){ b.addEventListener("click",function(){ setLang(b.dataset.lang); }); });
  $q.addEventListener("input", render);
  document.getElementById("clear").addEventListener("click", function(){ $q.value=""; render(); $q.focus(); });

  var params = new URLSearchParams(location.search), saved = null;
  try{ saved = localStorage.getItem("hm-lang"); }catch(e){}
  setLang(params.get("lang") || saved || "en");
  if(params.get("name")){ $q.value = params.get("name"); }
  load();
})();
</script>
</body>
